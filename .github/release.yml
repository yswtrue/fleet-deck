# Categories for GitHub's auto-generated release notes
# (used by `generate_release_notes` in .github/workflows/release.yml).
# Anything unlabelled or unmatched falls into the catch-all category last.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking changes
      labels:
        - breaking
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Documentation
      labels:
        - docs
    - title: Other changes
      labels:
        - '*'
