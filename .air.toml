# air - hot reload for the FleetDeck hub (dev only).
#
# `devenv up` runs `air -c .air.toml`: Go changes rebuild cmd/hub and restart
# the process. A restart drops every WS connection and the hub's in-memory
# session text buffer (pending asks included); nodes reconnect automatically
# and all Postgres-backed state survives. Never use this in production.
#
# Node daemon changes are not covered here -- restart `node` explicitly
# (`devenv processes restart node`) or run air with its own config.

root = "."
tmp_dir = ".devenv/state/air"

[build]
  cmd = "go build -o .devenv/state/bin/hub ./cmd/hub"
  entrypoint = [".devenv/state/bin/hub"]
  include_ext = ["go"]
  exclude_dir = [".devenv", ".git", "web", "vendor", "testdata", "migrations", "docs", "deploy", "examples", "scripts"]
  exclude_regex = ["_test\\.go"]
  delay = 300              # debounce bursts of writes
  stop_on_error = true     # keep air alive when the build fails
  send_interrupt = true    # SIGINT first so the hub shuts down gracefully
  kill_delay = "5s"
  log = ".devenv/state/air-build-errors.log"

[log]
  time = true

[misc]
  clean_on_exit = true
