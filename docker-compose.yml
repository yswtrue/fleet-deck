# FleetDeck deployment stack: Postgres + migrations + hub + web, with Traefik
# as the single ingress. Node daemons are intentionally NOT here — they run
# locally on each target machine and dial out to the hub (docs/DEPLOYMENT.md).
#
#   docker compose up -d --build     # then open http://localhost:<FLEETDECK_HUB_PORT>
#
# Ports and credentials are interpolated from .env (copy .env.example to .env);
# nothing is hardcoded here.
#
# Single-origin design: the SPA is built with VITE_HUB_URL=/ so /api and /ws
# go through Traefik to the hub — no CORS, one published entrypoint.

name: fleetdeck

x-hub-dsn: &hub-dsn postgres://${FLEETDECK_DB_USER:?set in .env}:${FLEETDECK_DB_PASSWORD:?set in .env}@postgres/${FLEETDECK_DB_NAME:?set in .env}?sslmode=disable

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${FLEETDECK_DB_NAME:?set in .env}
      POSTGRES_USER: ${FLEETDECK_DB_USER:?set in .env}
      POSTGRES_PASSWORD: ${FLEETDECK_DB_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${FLEETDECK_DB_USER:?set in .env} -d ${FLEETDECK_DB_NAME:?set in .env}',
        ]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Cache-only: no persistence — losing it just means cache misses.
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    # Same image for migrations and the hub. Set FLEETDECK_HUB_IMAGE in .env to
    # run a published release (ghcr.io/yswtrue/fleet-deck:vX.Y.Z) instead of
    # building locally; `docker compose up --build` keeps using the source tree.
    image: ${FLEETDECK_HUB_IMAGE:-fleetdeck-hub:local}
    build: { context: ., target: runtime }
    command: ['goose', '-dir', '/app/migrations', 'postgres', *hub-dsn, 'up']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  hub:
    image: ${FLEETDECK_HUB_IMAGE:-fleetdeck-hub:local}
    build: { context: ., target: runtime }
    command: ['/usr/local/bin/hub']
    environment:
      FLEETDECK_HUB_ADDR: ':${FLEETDECK_HUB_PORT:?set in .env}'
      FLEETDECK_DATABASE_URL: *hub-dsn
      FLEETDECK_REDIS_URL: redis://redis:6379/0
      # Automatic re-dispatch of a task whose node process restarted
      # (default 1, 0 disables).
      FLEETDECK_TASK_RETRY_LIMIT: ${FLEETDECK_TASK_RETRY_LIMIT:-}
      # Optional automation secret; the UI's single-use join tokens need no env.
      FLEETDECK_NODE_JOIN_TOKEN: ${FLEETDECK_NODE_JOIN_TOKEN:-}
    ports:
      # UI + API + WS on one port (the hub serves the embedded SPA). Also the
      # endpoint node daemons dial (ws://host:<FLEETDECK_HUB_PORT>/ws/node).
      - '${FLEETDECK_HUB_PORT:?set in .env}:${FLEETDECK_HUB_PORT:?set in .env}'
    labels:
      # Public hostname for the bundled Traefik (profile `traefik`). Set
      # FLEETDECK_PUBLIC_HOST in .env to serve a real domain; the default keeps
      # the route localhost-only so a shared ingress never gets a catch-all.
      # Behind an external Traefik, attach the hub to that proxy's network and
      # set traefik.docker.network there (docs/DEPLOYMENT.md).
      traefik.enable: 'true'
      traefik.http.routers.hub.rule: 'Host(`${FLEETDECK_PUBLIC_HOST:-localhost}`)'
      traefik.http.routers.hub.entrypoints: 'web'
      traefik.http.routers.hub.service: 'hub'
      traefik.http.routers.hub-secure.rule: 'Host(`${FLEETDECK_PUBLIC_HOST:-localhost}`)'
      traefik.http.routers.hub-secure.entrypoints: 'websecure'
      traefik.http.routers.hub-secure.tls: 'true'
      traefik.http.routers.hub-secure.service: 'hub'
      traefik.http.services.hub.loadbalancer.server.port: '${FLEETDECK_HUB_PORT:?set in .env}'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  traefik:
    # Opt-in ingress: `docker compose --profile traefik up -d`. Routes are
    # discovered from container labels; entrypoints are :80 and :443.
    profiles: ['traefik']
    # v3.7+ negotiates the Docker API version; older clients (API 1.24) are
    # rejected by modern daemons and the label provider silently sees nothing.
    image: traefik:v3.7.13
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - hub
    restart: unless-stopped

volumes:
  pgdata:
