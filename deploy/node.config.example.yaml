# FleetDeck node daemon configuration (template for a LOCAL node).
#
# Nodes run on the machines where the agent CLIs live and dial OUT to the hub —
# no inbound port is needed on the node machine:
#
#   go build -o fleetdeck-node ./cmd/node     # or `go run ./cmd/node`
#   ./fleetdeck-node --config node.config.yaml \
#     --hub-url ws://localhost:7710/ws/node --join-token <token from the UI>
#
# See docs/DEPLOYMENT.md for the full walkthrough.
name: my-machine # unique per node; shown in the web UI
host: my-machine.example.com
# Pick these with `fleetdeck-node config --config node.config.yaml` (it probes
# installed launchers and writes both keys); any of: fake, opencode, codex,
# claude, pi. Agent types are advertised as capabilities automatically, so
# `capabilities` is only for extra labels.
agent_types:
  - opencode
default_adapter: opencode
# Optional: --hub-url fills this in after the first successful registration.
hub_url: ws://localhost:7710/ws/node # or wss://hub.example.com/ws/node
token_file: ./node-token # created on first registration; keep it secret
# First registration only: the single-use pairing token from the UI
# (Nodes -> Add node) is passed as --join-token. The daemon uses the credential
# in token_file afterwards and never stores the join token.

# Optional (production leaves these unset):
# machine_id: ...   # defaults to a hash of the OS machine id; the hub allows
#                   # one node per machine
# lock_file: ...    # defaults to $TMPDIR/fleetdeck-node.lock; prevents a
#                   # second daemon on the same computer
