# FleetDeck node configuration for the default `devenv up` node.
#
#   go run ./cmd/node --config ./examples/node.config.yaml
#
# The default dev node advertises the fake adapter, so the hub and UI can be
# exercised without a real agent CLI. `probe-adapters` reports which real
# backends this host has; list those under agent_types (e.g. codex, opencode,
# claude, pi) to drive them from this node.
name: node-1
host: localhost
capabilities:
  - fake
agent_types:
  - fake
# hub_url is omitted: it is derived from $FLEETDECK_HUB_ADDR as
# ws://ADDR/ws/node (devenv derives that from .env). Set it explicitly for
# remote hubs, e.g. hub_url: wss://hub.example.com/ws/node
# Each node needs its own token file — one shared file makes the daemons
# overwrite each other's registration token.
token_file: ./.devenv/state/fleetdeck/node-1.token
